<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrimBG Balanced Tiny Benchmark</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #111827; color: #f9fafb; }
    main { max-width: 1000px; margin: 0 auto; }
    .panel { padding: 18px; background: #1f2937; border: 1px solid #374151; border-radius: 14px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; border-radius: 10px; padding: 10px 14px; background: #22c55e; color: #052e16; font-weight: 700; }
    button.secondary { background: #93c5fd; color: #172554; }
    pre { white-space: pre-wrap; line-height: 1.6; color: #d1fae5; }
    .images { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
    figure { margin: 0; padding: 10px; background: #111827; border-radius: 12px; }
    img { width: 100%; max-height: 520px; object-fit: contain; background: repeating-conic-gradient(#374151 0% 25%, #1f2937 0% 50%) 50% / 20px 20px; }
    figcaption { margin-top: 8px; color: #cbd5e1; }
    @media (max-width: 700px) { .images { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>اختبار النموذج الطالب المتوازن</h1>
    <div class="panel">
      <p>هذا الاختبار مستقل عن الإنتاج. النموذج حجمه أقل من 1 MB ويعمل بدقة 96×96 عبر ONNX Runtime Web وWASM.</p>
      <div class="row">
        <input id="file" type="file" accept="image/*" />
        <button id="sample" class="secondary">تحميل صورة الاختبار</button>
        <button id="run">تشغيل النموذج المتوازن</button>
      </div>
      <pre id="status">جاهز. crossOriginIsolated = …</pre>
    </div>
    <div class="images">
      <figure><img id="before" alt="الصورة الأصلية" /><figcaption>الأصل</figcaption></figure>
      <figure><img id="after" alt="النتيجة" /><figcaption>النتيجة</figcaption></figure>
    </div>
  </main>
  <script type="module">
    import { preloadTinyMatting, removeBackgroundWithTinyMatting } from '/src/lib/tinyBalancedBrowser.ts';
    const fileInput = document.querySelector('#file');
    const before = document.querySelector('#before');
    const after = document.querySelector('#after');
    const status = document.querySelector('#status');
    let selectedBlob = null;
    let selectedUrl = null;
    function setStatus(text) { status.textContent = text; }
    function setBlob(blob) {
      selectedBlob = blob;
      if (selectedUrl) URL.revokeObjectURL(selectedUrl);
      selectedUrl = URL.createObjectURL(blob);
      before.src = selectedUrl;
      after.removeAttribute('src');
    }
    fileInput.addEventListener('change', () => {
      const file = fileInput.files?.[0];
      if (file) setBlob(file);
    });
    document.querySelector('#sample').addEventListener('click', async () => {
      setStatus('تحميل صورة الاختبار…');
      const response = await fetch('/photo-1517841905240-472988babdf9.jpg');
      setBlob(await response.blob());
      setStatus('تم تحميل الصورة. اضغط تشغيل النموذج المتوازن.');
    });
    document.querySelector('#run').addEventListener('click', async () => {
      if (!selectedBlob) { setStatus('اختر صورة أولاً.'); return; }
      const started = performance.now();
      try {
        setStatus('تحميل/تهيئة النموذج…');
        await preloadTinyMatting();
        const loadedMs = performance.now() - started;
        setStatus(`النموذج جاهز بعد ${loadedMs.toFixed(0)} ms. بدء الاستدلال…`);
        const result = await removeBackgroundWithTinyMatting(selectedBlob);
        after.src = URL.createObjectURL(result.blob);
        setStatus(JSON.stringify({
          crossOriginIsolated,
          hardwareConcurrency: navigator.hardwareConcurrency,
          modelReadyMs: Math.round(loadedMs),
          inferenceMs: Math.round(result.timing.inferenceMs),
          totalMs: Math.round(performance.now() - started),
          outputBytes: result.blob.size,
        }, null, 2));
      } catch (error) {
        console.error(error);
        setStatus(`فشل الاختبار: ${error instanceof Error ? error.stack || error.message : String(error)}`);
      }
    });
    setStatus(`جاهز. crossOriginIsolated = ${String(crossOriginIsolated)}، threads = ${navigator.hardwareConcurrency}`);
  </script>
</body>
</html>
